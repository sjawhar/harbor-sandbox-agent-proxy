name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harbor: ["0.23.0", "0.24.0"]
        inspect: ["0.3.278", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          uv sync --all-extras --group dev
          if [ "${{ matrix.inspect }}" = "latest" ]; then uv pip install --upgrade inspect-ai; else uv pip install "inspect-ai==${{ matrix.inspect }}"; fi
          uv pip install "harbor==${{ matrix.harbor }}"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      - run: uv run pytest -n 4 -q
      - name: Compare relay assertions with hawk
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/trajectory-labs-pbc/hawk "$RUNNER_TEMP/hawk"
          mkdir -p "$RUNNER_TEMP/hawk-tests"
          for f in conftest.py test_relay.py test_relay_agent.py test_relay_environment.py test_relay_outcome.py test_sandbox_adapter.py test_trial_relay.py test_trial_relay_tool_phase.py; do
            git -C "$RUNNER_TEMP/hawk" show "bbe4f65ba8a7:hawk/tests/runner/harbor/$f" > "$RUNNER_TEMP/hawk-tests/$f"
          done
          uv run --all-extras --group dev python tools/compare_assertions.py --reference "$RUNNER_TEMP/hawk-tests" --candidate tests \
            --rename hawk_relay=sandbox_agent_proxy --rename relay_environment=environment --rename relay_agent=agent --allow tools/hawk-only-tests.txt
      - run: sudo "$(uv run which python)" -m pytest tests/test_relay_environment.py -p no:cacheprovider -q
